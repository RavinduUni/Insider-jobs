name: Deploy to AWS EKS

on:
    push:
        branches:
            - main
        paths:
            - 'server'
    workflow_dispatch:

jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: "25"

            - name: Install Dependencies
              working-directory: server
              run: npm ci 

            - name: Run Tests (If any)
              working-directory: server
              run: npm test --if-present

    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
 
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
  
            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                context: server
                push: true
                tags: |
                  ${{ secrets.DOCKER_USERNAME }}/freelancing-platform-server:latest 

    deploy-aws-eks:
        runs-on: ubuntu-latest
        needs: docker-build-push
        
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6.1.0
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ap-south-1

            - name: Setup Kubectl
              uses: azure/setup-kubectl@v4

            - name: Update kubeconfig for EKS
              run: aws eks update-kubeconfig --name freelancing-cluster --region ap-south-1

            - name: Verify connection
              run: kubectl get nodes

            - name: Create Kubernetes Secrets
              run: |
                kubectl create secret generic freelancing-platform-server-secrets \
                  --from-literal=PORT="${{ secrets.PORT }}" \
                  --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
                  --from-literal=MONGODB_URI="${{ secrets.MONGODB_URI }}" \
                  --from-literal=CLOUDINARY_NAME="${{ secrets.CLOUDINARY_NAME }}" \
                  --from-literal=CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}" \
                  --from-literal=CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}" \
                  --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
                  --from-literal=GEMINI_BASE_URL="${{ secrets.GEMINI_BASE_URL }}" \
                  --from-literal=GEMINI_MODEL="${{ secrets.GEMINI_MODEL }}" \
                  --from-literal=SMTP_HOST="${{ secrets.SMTP_HOST }}" \
                  --from-literal=SMTP_PORT="${{ secrets.SMTP_PORT }}" \
                  --from-literal=SMTP_USER="${{ secrets.SMTP_USER }}" \
                  --from-literal=SMTP_PASS="${{ secrets.SMTP_PASS }}" \
                  --dry-run=client -o yaml | kubectl apply -f -
              
            - name: Deploy to AWS
              run: kubectl apply -f server/k8s/app.yaml